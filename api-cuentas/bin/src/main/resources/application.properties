spring.application.name=api-cuentas
server.port=8081

spring.config.import=configserver:http://localhost:8888

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true

management.endpoints.web.exposure.include=health,info,refresh

resilience4j.circuitbreaker.instances.cuentaService.sliding-window-size=5
resilience4j.circuitbreaker.instances.cuentaService.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.cuentaService.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.cuentaService.permitted-number-of-calls-in-half-open-state=3

resilience4j.retry.instances.cuentaService.max-attempts=3
resilience4j.retry.instances.cuentaService.wait-duration=2s