spring.application.name=api-cuentas
server.port=8081

# ── Config Server ──────────────────────────────────────────────────────────
# Variable de entorno SPRING_CONFIG_IMPORT permite sobreescribir en Docker.
# Valor por defecto: localhost (ejecución local).
spring.config.import=${SPRING_CONFIG_IMPORT:configserver:http://localhost:8888}

# ── Eureka ─────────────────────────────────────────────────────────────────
# EUREKA_CLIENT_SERVICEURL_DEFAULTZONE sobreescribe en Docker.
eureka.client.service-url.defaultZone=${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}
eureka.instance.prefer-ip-address=true

# ── Actuator ───────────────────────────────────────────────────────────────
management.endpoints.web.exposure.include=health,info,refresh
management.endpoint.health.show-details=always

# ── Resilience4j Circuit Breaker ───────────────────────────────────────────
resilience4j.circuitbreaker.instances.cuentaService.sliding-window-size=5
resilience4j.circuitbreaker.instances.cuentaService.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.cuentaService.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.cuentaService.permitted-number-of-calls-in-half-open-state=3

# ── Resilience4j Retry ─────────────────────────────────────────────────────
resilience4j.retry.instances.cuentaService.max-attempts=3
resilience4j.retry.instances.cuentaService.wait-duration=2s

# ── OAuth2 Resource Server ─────────────────────────────────────────────────
# Variables de entorno permiten sobreescribir en Docker.
# Valores por defecto apuntan a localhost (ejecución local).
# IMPORTANTE: el issuer-uri debe coincidir EXACTAMENTE con el issuer del auth-server.
spring.security.oauth2.resourceserver.jwt.issuer-uri=${SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI:http://localhost:9000}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI:http://localhost:9000/oauth2/jwks}
