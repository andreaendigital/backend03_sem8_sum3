services:

  # ─────────────────────────────────────────────────────────────────────────
  # INFRAESTRUCTURA
  # MySQL corre LOCAL en el host, NO en Docker.
  # api-cuentas se conecta via host.docker.internal:3306
  # ─────────────────────────────────────────────────────────────────────────

  kafka:
    image: apache/kafka:4.0.0
    container_name: kafka-banco-xyz
    restart: unless-stopped
    ports:
      - "9092:9092"
    environment:
      # KRaft mode — sin Zookeeper
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      # INTERNAL: usado por contenedores Docker (kafka:29092)
      # EXTERNAL: usado desde el host (localhost:9092)
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_RETENTION_HOURS: 24
    networks:
      - banco-xyz-network
    healthcheck:
      # Healthcheck simplificado: verifica que el puerto 9092 responde
      test: ["CMD-SHELL", "echo > /dev/tcp/localhost/9092 2>/dev/null && echo ok || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  # ─────────────────────────────────────────────────────────────────────────
  # MICROSERVICIOS — orden: config-server → eureka → auth-server → api-cuentas
  # ─────────────────────────────────────────────────────────────────────────

  config-server:
    build:
      context: ./config-server
      dockerfile: Dockerfile
    container_name: config-server-banco-xyz
    restart: unless-stopped
    ports:
      - "8888:8888"
    networks:
      - banco-xyz-network
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8888/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s

  eureka-server:
    build:
      context: ./eureka-server
      dockerfile: Dockerfile
    container_name: eureka-banco-xyz
    restart: unless-stopped
    ports:
      - "8761:8761"
    environment:
      # Sobreescribe eureka.instance.hostname para que use nombre Docker
      EUREKA_INSTANCE_HOSTNAME: eureka-server
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
    networks:
      - banco-xyz-network
    depends_on:
      config-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8761/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s

  auth-server:
    build:
      context: ./auth-server
      dockerfile: Dockerfile
    container_name: auth-server-banco-xyz
    restart: unless-stopped
    ports:
      - "9000:9000"
    environment:
      # Issuer dentro de Docker usa nombre de servicio
      AUTH_SERVER_ISSUER: http://auth-server:9000
    networks:
      - banco-xyz-network
    depends_on:
      config-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9000/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 90s

  api-cuentas:
    build:
      context: ./api-cuentas
      dockerfile: Dockerfile
    container_name: api-cuentas-banco-xyz
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      # Config Server — nombre de servicio Docker
      SPRING_CONFIG_IMPORT: configserver:http://config-server:8888
      # Eureka — nombre de servicio Docker
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      # OAuth2 Resource Server — nombre de servicio Docker
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: http://auth-server:9000
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: http://auth-server:9000/oauth2/jwks
      # MySQL LOCAL — acceso al host via host.docker.internal
      SPRING_DATASOURCE_URL: jdbc:mysql://host.docker.internal:3306/bank_batch
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: admin
      # Kafka — listener interno Docker
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    networks:
      - banco-xyz-network
    depends_on:
      config-server:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
      auth-server:
        condition: service_healthy
      kafka:
        condition: service_healthy
    extra_hosts:
      # Garantiza que host.docker.internal resuelva al host en todas las plataformas
      - "host.docker.internal:host-gateway"

# ─────────────────────────────────────────────────────────────────────────────
# RED
# No hay volumen de MySQL — la BD vive en el host local
# ─────────────────────────────────────────────────────────────────────────────

networks:
  banco-xyz-network:
    driver: bridge
