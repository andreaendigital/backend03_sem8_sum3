# ── Datasource ─────────────────────────────────────────────────────────────
# DATASOURCE_URL sobreescribe en Docker (nombre servicio: mysql).
# Valor por defecto: localhost (ejecución local).
spring.datasource.url=${DATASOURCE_URL:jdbc:mysql://localhost:3306/bank_batch}
spring.datasource.username=${DATASOURCE_USERNAME:root}
spring.datasource.password=${DATASOURCE_PASSWORD:admin}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=none

# ── HikariCP ───────────────────────────────────────────────────────────────
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=3
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.validation-timeout=5000

# ── Kafka ──────────────────────────────────────────────────────────────────
# KAFKA_BOOTSTRAP_SERVERS sobreescribe en Docker (nombre servicio: kafka, puerto interno 29092).
# Valor por defecto: localhost:9092 (ejecución local).
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
banco.kafka.topic.transacciones=transacciones-eventos
