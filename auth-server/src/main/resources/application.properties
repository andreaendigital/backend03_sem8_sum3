spring.application.name=auth-server
server.port=9000

# ── Registro del cliente OAuth2 ─────────────────────────────────────────────
# La auto-configuración de Spring Boot 4.1.1 lee estos valores y registra
# el cliente en un InMemoryRegisteredClientRepository automáticamente.
#
# Grant type: client_credentials (machine-to-machine, sin login de usuario)
# El cliente se autentica con Basic Auth: clientId:clientSecret
# Scope: cuentas.read (api-cuentas verifica que el token tenga este scope)

spring.security.oauth2.authorizationserver.client.api-cuentas-client.registration.client-id=api-cuentas-client
spring.security.oauth2.authorizationserver.client.api-cuentas-client.registration.client-secret={noop}api-cuentas-secret-2026
spring.security.oauth2.authorizationserver.client.api-cuentas-client.registration.client-authentication-methods=client_secret_basic
spring.security.oauth2.authorizationserver.client.api-cuentas-client.registration.authorization-grant-types=client_credentials
spring.security.oauth2.authorizationserver.client.api-cuentas-client.registration.scopes=cuentas.read

# Duración del access token: 1 hora
spring.security.oauth2.authorizationserver.client.api-cuentas-client.token.access-token-time-to-live=PT1H

# ── Issuer URI ────────────────────────────────────────────────────────────────
# Debe coincidir con el issuer que api-cuentas usará para validar tokens.
# En Docker: http://auth-server:9000
# En local:  http://localhost:9000
spring.security.oauth2.authorizationserver.issuer=${AUTH_SERVER_ISSUER:http://localhost:9000}

# ── Actuator — health check para Docker ────────────────────────────────────
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
